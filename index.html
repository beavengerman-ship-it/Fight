<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Knockout Puncher</title>
    <!-- Tailwind CSS for UI framing -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            overflow: hidden;
            background-color: #0f172a;
        }
        .comic-font {
            font-family: 'Bangers', cursive;
            letter-spacing: 1px;
        }
        canvas {
            touch-action: none;
        }
        @keyframes popIn {
            0% { transform: scale(0) rotate(-15deg); opacity: 0; }
            50% { transform: scale(1.3) rotate(5deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 0; }
        }
        .pop-text {
            animation: popIn 0.4s ease-out forwards;
        }
        .glow-red {
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.6);
        }
        .glow-blue {
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.6);
        }
        .glow-gold {
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.7);
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between items-center text-white relative">

    <!-- Top HUD Bar -->
    <div class="w-full max-w-md px-4 pt-4 pb-2 z-10 flex justify-between items-center bg-slate-900/80 backdrop-blur-md rounded-b-2xl border-b border-slate-700 shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="bg-slate-800 p-2.5 rounded-xl border border-slate-700 flex flex-col items-center min-w-[70px]">
                <span class="text-xs text-slate-400 font-semibold uppercase tracking-wider">Score</span>
                <span id="scoreText" class="comic-font text-2xl text-yellow-400">0</span>
            </div>
            <div class="bg-slate-800 p-2.5 rounded-xl border border-slate-700 flex flex-col items-center min-w-[70px]">
                <span class="text-xs text-slate-400 font-semibold uppercase tracking-wider">Combo</span>
                <span id="comboText" class="comic-font text-2xl text-orange-500">x0</span>
            </div>
        </div>

        <div class="flex flex-col items-end">
            <div class="flex space-x-2">
                <label class="h-10 px-3 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 border border-emerald-400 font-semibold text-xs uppercase tracking-wider flex items-center justify-center cursor-pointer active:scale-95 transition shadow-md text-white">
                    <i class="fas fa-camera mr-1.5"></i> Custom Face
                    <input type="file" id="faceUploadInput" accept="image/*" class="hidden">
                </label>
                <button id="resetFaceBtn" class="hidden w-10 h-10 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-red-400 active:scale-95 transition" title="Reset Face">
                    <i class="fas fa-rotate-left text-lg"></i>
                </button>
                <button id="soundToggleBtn" class="w-10 h-10 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-yellow-400 active:scale-95 transition">
                    <i class="fas fa-volume-up text-lg"></i>
                </button>
                <button id="charToggleBtn" class="h-10 px-3 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 border border-purple-400 font-semibold text-xs uppercase tracking-wider flex items-center justify-center active:scale-95 transition shadow-md">
                    <i class="fas fa-user-ninja mr-1.5"></i> <span id="charName">Bob</span>
                </button>
            </div>
            <div class="text-[11px] text-slate-400 mt-1 font-semibold">
                BEST: <span id="highScoreText" class="text-slate-200">0</span>
            </div>
        </div>
    </div>

    <!-- Central Canvas Area -->
    <div id="canvasContainer" class="relative w-full flex-1 flex justify-center items-center overflow-hidden">
        <canvas id="gameCanvas" class="w-full h-full cursor-pointer"></canvas>
        <div id="fxOverlay" class="absolute inset-0 pointer-events-none flex items-center justify-center"></div>
    </div>

    <!-- Bottom Controls -->
    <div class="w-full max-w-md px-4 pb-6 pt-2 z-10 flex flex-col gap-3">
        <div class="w-full bg-slate-800/90 rounded-full h-3 p-0.5 border border-slate-700 overflow-hidden shadow-inner">
            <div id="superBar" class="bg-gradient-to-r from-amber-500 via-orange-500 to-red-600 h-full rounded-full w-0 transition-all duration-200 shadow-md"></div>
        </div>

        <div class="grid grid-cols-3 gap-3">
            <button id="leftJabBtn" class="bg-gradient-to-b from-blue-500 to-blue-700 hover:from-blue-400 hover:to-blue-600 active:scale-90 transition-transform duration-75 p-3 rounded-2xl border-b-4 border-blue-900 flex flex-col items-center justify-center shadow-lg glow-blue touch-none">
                <i class="fas fa-hand-fist text-2xl mb-1 transform -scale-x-100"></i>
                <span class="comic-font text-lg leading-none tracking-wide">LEFT JAB</span>
            </button>

            <button id="superPunchBtn" disabled class="opacity-40 bg-gradient-to-b from-amber-400 to-red-600 p-3 rounded-2xl border-b-4 border-red-900 flex flex-col items-center justify-center shadow-lg touch-none transition-all duration-150">
                <i class="fas fa-bolt text-2xl mb-1 text-yellow-200 animate-pulse"></i>
                <span class="comic-font text-lg leading-none tracking-wide text-yellow-100">SUPER!</span>
            </button>

            <button id="rightHookBtn" class="bg-gradient-to-b from-red-500 to-red-700 hover:from-red-400 hover:to-red-600 active:scale-90 transition-transform duration-75 p-3 rounded-2xl border-b-4 border-red-900 flex flex-col items-center justify-center shadow-lg glow-red touch-none">
                <i class="fas fa-hand-fist text-2xl mb-1"></i>
                <span class="comic-font text-lg leading-none tracking-wide">RIGHT HOOK</span>
            </button>
        </div>

        <div class="text-center text-slate-400 text-xs font-medium opacity-80">
            <i class="fas fa-touch-app mr-1"></i> Tap anywhere on screen or use buttons to punch!
        </div>
    </div>

    <script>
        class SoundFX {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playHit(isSuper = false) {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = isSuper ? 'triangle' : 'sine';
                const startFreq = isSuper ? 260 : 180;
                const endFreq = isSuper ? 30 : 40;

                osc.frequency.setValueAtTime(startFreq, now);
                osc.frequency.exponentialRampToValueAtTime(endFreq, now + (isSuper ? 0.35 : 0.15));

                gain.gain.setValueAtTime(1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + (isSuper ? 0.35 : 0.15));

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + (isSuper ? 0.35 : 0.15));

                const bufferSize = this.ctx.sampleRate * (isSuper ? 0.2 : 0.08);
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const output = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const noiseFilter = this.ctx.createBiquadFilter();
                noiseFilter.type = 'bandpass';
                noiseFilter.frequency.value = isSuper ? 800 : 1200;

                const noiseGain = this.ctx.createGain();
                noiseGain.gain.setValueAtTime(isSuper ? 0.8 : 0.5, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, now + (isSuper ? 0.2 : 0.08));

                noise.connect(noiseFilter);
                noiseFilter.connect(noiseGain);
                noiseGain.connect(this.ctx.destination);

                noise.start(now);
            }

            playKoSound() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.linearRampToValueAtTime(60, now + 0.6);

                gain.gain.setValueAtTime(0.7, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.6);
            }
        }

        const fxOverlay = document.getElementById('fxOverlay');

        let customFaceImage = new Image();
        customFaceImage.src = defaultFaceBase64;

        document.getElementById('highScoreText').textContent = highScore;

        const CHARACTERS = [
            { name: 'Bob', skinColor: '#fca5a5', hairColor: '#b45309', shirtColor: '#3b82f6' },
            { name: 'Alien', skinColor: '#4ade80', hairColor: '#15803d', shirtColor: '#8b5cf6' },
            { name: 'Robot', skinColor: '#94a3b8', hairColor: '#475569', shirtColor: '#e11d48' },
            { name: 'Dude', skinColor: '#fdba74', hairColor: '#1e293b', shirtColor: '#10b981' }
        ];
        let currentCharIdx = 0;

        const target = {
            x: 0, y: 0, baseX: 0, baseY: 0, vx: 0, vy: 0, angle: 0, vAngle: 0,
            expression: 'normal', expressionTimer: 0, starsAngle: 0
        };

        const gloveLeft = { x: -200, y: 0, targetX: 0, targetY: 0, active: false, scale: 1 };
        const gloveRight = { x: 200, y: 0, targetX: 0, targetY: 0, active: false, scale: 1 };

        let particles = [];
        let comicTexts = [];

        function resizeCanvas() {
            const container = document.getElementById('canvasContainer');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;

            target.baseX = canvas.width / 2;
            target.baseY = canvas.height * 0.52;

            if (target.x === 0 && target.y === 0) {
                target.x = target.baseX;
                target.y = target.baseY;
            }
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function drawCharacter(c, t) {
            const charDef = CHARACTERS[currentCharIdx];

            c.save();
            c.translate(t.x, t.y);
            c.rotate(t.angle);

            c.fillStyle = charDef.shirtColor;
            c.beginPath();
            c.ellipse(0, 140, 90, 60, 0, 0, Math.PI * 2);
            c.fill();
            c.lineWidth = 4;
            c.strokeStyle = '#0f172a';
            c.stroke();

            c.fillStyle = charDef.skinColor;
            c.fillRect(-20, 60, 40, 40);
            c.strokeRect(-20, 60, 40, 40);

            c.beginPath();
            c.arc(0, 0, 75, 0, Math.PI * 2);
            c.fillStyle = charDef.skinColor;
            c.fill();
            c.lineWidth = 5;
            c.strokeStyle = '#0f172a';
            c.stroke();

            if (customFaceImage) {
                c.save();
                c.beginPath();
                c.arc(0, 0, 73, 0, Math.PI * 2);
                c.clip();

                const scale = Math.max(150 / customFaceImage.width, 150 / customFaceImage.height);
                const w = customFaceImage.width * scale;
                const h = customFaceImage.height * scale;
                c.drawImage(customFaceImage, -w / 2, -h / 2, w, h);

                if (t.expression === 'hit' || t.expression === 'ko') {
                    c.fillStyle = 'rgba(239, 68, 68, 0.4)';
                    c.fillRect(-75, -75, 150, 150);
                }

                if (score > 20) {
                    c.fillStyle = 'rgba(147, 51, 234, 0.35)';
                    c.beginPath();
                    c.arc(-25, -10, 20, 0, Math.PI * 2);
                    c.fill();
                }

                c.restore();

                c.beginPath();
                c.arc(0, 0, 75, 0, Math.PI * 2);
                c.lineWidth = 5;
                c.strokeStyle = '#0f172a';
                c.stroke();
            } else {
                c.fillStyle = charDef.hairColor;
                c.beginPath();
                c.arc(0, -15, 76, Math.PI, 0);
                c.fill();

                c.fillStyle = '#ffffff';
                c.strokeStyle = '#0f172a';
                c.lineWidth = 3;

                if (t.expression === 'ko' || t.expression === 'dizzy') {
                    drawXEyes(c, -30, -10);
                    drawXEyes(c, 30, -10);
                } else if (t.expression === 'hit') {
                    c.beginPath();
                    c.moveTo(-45, -15); c.lineTo(-15, -5);
                    c.moveTo(15, -5); c.lineTo(45, -15);
                    c.stroke();
                } else {
                    c.beginPath();
                    c.arc(-30, -10, 16, 0, Math.PI * 2);
                    c.arc(30, -10, 16, 0, Math.PI * 2);
                    c.fill();
                    c.stroke();

                    c.fillStyle = '#0f172a';
                    c.beginPath();
                    c.arc(-28 + Math.sin(Date.now() * 0.003) * 3, -10, 7, 0, Math.PI * 2);
                    c.arc(32 + Math.sin(Date.now() * 0.003) * 3, -10, 7, 0, Math.PI * 2);
                    c.fill();
                }

                c.strokeStyle = charDef.hairColor;
                c.lineWidth = 6;
                c.beginPath();
                if (t.expression === 'hit' || t.expression === 'ko') {
                    c.moveTo(-45, -35); c.lineTo(-20, -25);
                    c.moveTo(45, -35); c.lineTo(20, -25);
                } else {
                    c.moveTo(-45, -30); c.lineTo(-20, -32);
                    c.moveTo(45, -30); c.lineTo(20, -32);
                }
                c.stroke();

                c.strokeStyle = '#0f172a';
                c.lineWidth = 4;
                c.fillStyle = charDef.skinColor;
                c.beginPath();
                c.arc(0, 10, 10, 0, Math.PI);
                c.stroke();

                c.beginPath();
                if (t.expression === 'hit') {
                    c.fillStyle = '#991b1b';
                    c.arc(0, 35, 18, 0, Math.PI * 2);
                    c.fill();
                    c.stroke();
                } else if (t.expression === 'ko' || t.expression === 'dizzy') {
                    c.moveTo(-20, 40);
                    c.quadraticCurveTo(-10, 30, 0, 40);
                    c.quadraticCurveTo(10, 50, 20, 40);
                    c.stroke();
                } else {
                    c.arc(0, 25, 20, 0.1 * Math.PI, 0.9 * Math.PI);
                    c.stroke();
                }

                if (score > 15) {
                    c.fillStyle = 'rgba(147, 51, 234, 0.3)';
                    c.beginPath();
                    c.arc(-35, 10, 14, 0, Math.PI * 2);
                    c.fill();
                }
                if (score > 35) {
                    c.strokeStyle = '#fde047';
                    c.lineWidth = 5;
                    c.beginPath();
                    c.moveTo(25, 15); c.lineTo(45, 30);
                    c.moveTo(45, 15); c.lineTo(25, 30);
                    c.stroke();
                }
            }

            c.restore();

            if (t.expression === 'dizzy' || t.expression === 'ko') {
                drawDizzyStars(c, t.x, t.y - 110, t.starsAngle);
            }
        }

        function drawXEyes(c, x, y) {
            c.beginPath();
            c.moveTo(x - 12, y - 12); c.lineTo(x + 12, y + 12);
            c.moveTo(x + 12, y - 12); c.lineTo(x - 12, y + 12);
            c.stroke();
        }

        function drawDizzyStars(c, cx, cy, angle) {
            c.save();
            c.translate(cx, cy);
            for (let i = 0; i < 3; i++) {
                const a = angle + (i * (Math.PI * 2 / 3));
                const sx = Math.cos(a) * 45;
                const sy = Math.sin(a) * 15;
                
                c.fillStyle = '#f59e0b';
                c.beginPath();
                c.arc(sx, sy, 7, 0, Math.PI * 2);
                c.fill();
            }
            c.restore();
        }

        function drawGloves(c) {
            [gloveLeft, gloveRight].forEach((g, idx) => {
                if (!g.active && Math.hypot(g.x - g.targetX, g.y - g.targetY) < 5) return;

                c.save();
                c.translate(g.x, g.y);
                c.scale(g.scale, g.scale);

                c.beginPath();
                c.arc(0, 0, 45, 0, Math.PI * 2);
                c.fillStyle = idx === 0 ? '#2563eb' : '#dc2626';
                c.fill();
                c.lineWidth = 4;
                c.strokeStyle = '#0f172a';
                c.stroke();

                c.beginPath();
                c.arc(idx === 0 ? 25 : -25, 10, 18, 0, Math.PI * 2);
                c.fillStyle = idx === 0 ? '#1d4ed8' : '#b91c1c';
                c.fill();
                c.stroke();

                c.fillStyle = '#ffffff';
                c.fillRect(-30, 30, 60, 15);
                c.strokeRect(-30, 30, 60, 15);

                c.restore();
            });
        }

        function drawParticles(c) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.3;
                p.life -= 0.03;

                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                c.save();
                c.globalAlpha = p.life;
                c.fillStyle = p.color;
                c.beginPath();
                c.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                c.fill();
                c.restore();
            }
        }

        function updatePhysics() {
            const k = 0.08;
            const damping = 0.82;

            const dx = target.x - target.baseX;
            const dy = target.y - target.baseY;

            const ax = -k * dx;
            const ay = -k * dy;

            target.vx += ax;
            target.vy += ay;
            target.vx *= damping;
            target.vy *= damping;

            target.x += target.vx;
            target.y += target.vy;

            const aTorque = -0.06 * target.angle;
            target.vAngle += aTorque;
            target.vAngle *= 0.80;
            target.angle += target.vAngle;

            target.starsAngle += 0.08;

            [gloveLeft, gloveRight].forEach(g => {
                g.x += (g.targetX - g.x) * 0.35;
                g.y += (g.targetY - g.y) * 0.35;
                g.scale += (1 - g.scale) * 0.2;
            });

            if (target.expressionTimer > 0) {
                target.expressionTimer--;
                if (target.expressionTimer <= 0) {
                    target.expression = 'normal';
                }
            }
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const grad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 50, canvas.width/2, canvas.height/2, canvas.width);
            grad.addColorStop(0, '#1e293b');
            grad.addColorStop(1, '#0f172a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.beginPath();
            ctx.ellipse(canvas.width / 2, canvas.height * 0.78, 140, 40, 0, 0, Math.PI * 2);
            ctx.fill();

            updatePhysics();
            drawCharacter(ctx, target);
            drawGloves(ctx);
            drawParticles(ctx);

            requestAnimationFrame(render);
        }

        function executePunch(type, hitX = target.x, hitY = target.y) {
            sounds.init();
            const isSuper = type === 'super';
            const isLeft = type === 'left' || (type === 'tap' && Math.random() > 0.5);

            const glove = isLeft ? gloveLeft : gloveRight;
            
            glove.x = isLeft ? -100 : canvas.width + 100;
            glove.y = canvas.height + 100;
            glove.targetX = hitX;
            glove.targetY = hitY;
            glove.scale = isSuper ? 1.8 : 1.3;
            glove.active = true;

            const forceX = isSuper ? (isLeft ? 80 : -80) : (isLeft ? 45 : -45);
            const forceY = isSuper ? -60 : -25;
            const torque = isLeft ? 0.35 : -0.35;

            target.vx += forceX;
            target.vy += forceY;
            target.vAngle += torque * (isSuper ? 2 : 1);

            target.expression = isSuper ? 'ko' : 'hit';
            target.expressionTimer = isSuper ? 45 : 18;

            sounds.playHit(isSuper);
            if (isSuper) sounds.playKoSound();

            spawnHitParticles(hitX, hitY, isSuper);
            spawnComicText(hitX, hitY, isSuper);

            score += isSuper ? 50 : 10;
            combo++;
            document.getElementById('scoreText').textContent = score;
            document.getElementById('comboText').textContent = `x${combo}`;

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('punch_high_score', highScore);
                document.getElementById('highScoreText').textContent = highScore;
            }

            if (!isSuper) {
                superGauge = Math.min(100, superGauge + 15);
                updateSuperBar();
            } else {
                superGauge = 0;
                updateSuperBar();
            }

            clearTimeout(comboTimer);
            comboTimer = setTimeout(() => {
                combo = 0;
                document.getElementById('comboText').textContent = 'x0';
            }, 1800);

            setTimeout(() => {
                glove.targetX = isLeft ? -150 : canvas.width + 150;
                glove.targetY = canvas.height + 150;
            }, 120);
        }

        function updateSuperBar() {
            const bar = document.getElementById('superBar');
            const superBtn = document.getElementById('superPunchBtn');
            bar.style.width = `${superGauge}%`;

            if (superGauge >= 100) {
                superBtn.disabled = false;
                superBtn.classList.remove('opacity-40');
                superBtn.classList.add('glow-gold', 'scale-105');
            } else {
                superBtn.disabled = true;
                superBtn.classList.add('opacity-40');
                superBtn.classList.remove('glow-gold', 'scale-105');
            }
        }

        function spawnHitParticles(x, y, isSuper) {
            const count = isSuper ? 30 : 12;
            const colors = isSuper 
                ? ['#f59e0b', '#ef4444', '#fde047', '#ffffff'] 
                : ['#3b82f6', '#f43f5e', '#ffffff'];

            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = (Math.random() * 8 + 4) * (isSuper ? 1.8 : 1);
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 6 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    life: 1.0
                });
            }
        }

        function spawnComicText(x, y, isSuper) {
            const words = isSuper 
                ? ['K.O.!', 'CRASH!', 'SUPER!', 'BOOM!'] 
                : ['POW!', 'BAM!', 'SMACK!', 'WHAM!', 'POP!'];
            const word = words[Math.floor(Math.random() * words.length)];

            const el = document.createElement('div');
            el.className = 'absolute comic-font pop-text text-amber-400 drop-shadow-[0_4px_4px_rgba(0,0,0,0.8)] pointer-events-none select-none z-20';
            el.style.fontSize = isSuper ? '3.5rem' : '2.2rem';
            el.style.color = isSuper ? '#ef4444' : '#f59e0b';
            el.style.left = `${x - 40 + (Math.random() * 40 - 20)}px`;
            el.style.top = `${y - 40 + (Math.random() * 40 - 20)}px`;
            el.textContent = word;

            fxOverlay.appendChild(el);
            setTimeout(() => el.remove(), 450);
        }

        canvas.addEventListener('pointerdown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const touchX = e.clientX - rect.left;
            const touchY = e.clientY - rect.top;
            
            executePunch('tap', touchX, touchY);
        });

        document.getElementById('leftJabBtn').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            executePunch('left', target.x - 30, target.y - 10);
        });

        document.getElementById('rightHookBtn').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            executePunch('right', target.x + 30, target.y - 10);
        });

        document.getElementById('superPunchBtn').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (superGauge >= 100) {
                executePunch('super', target.x, target.y - 20);
            }
        });

        const soundBtn = document.getElementById('soundToggleBtn');
        soundBtn.addEventListener('click', () => {
            sounds.muted = !sounds.muted;
            soundBtn.innerHTML = sounds.muted 
                ? '<i class="fas fa-volume-mute text-lg text-slate-500"></i>' 
                : '<i class="fas fa-volume-up text-lg text-yellow-400"></i>';
        });

        const charBtn = document.getElementById('charToggleBtn');
        charBtn.addEventListener('click', () => {
            currentCharIdx = (currentCharIdx + 1) % CHARACTERS.length;
            document.getElementById('charName').textContent = CHARACTERS[currentCharIdx].name;
            target.vy = -30;
            target.expression = 'dizzy';
            target.expressionTimer = 25;
        });

        const faceUploadInput = document.getElementById('faceUploadInput');
        const resetFaceBtn = document.getElementById('resetFaceBtn');

        resetFaceBtn.classList.remove('hidden');

        faceUploadInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        customFaceImage = img;
                        resetFaceBtn.classList.remove('hidden');
                        target.vy = -20;
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        resetFaceBtn.addEventListener('click', () => {
            customFaceImage = null;
            faceUploadInput.value = '';
            resetFaceBtn.classList.add('hidden');
        });

        requestAnimationFrame(render);
    </script>
</body>
</html>
